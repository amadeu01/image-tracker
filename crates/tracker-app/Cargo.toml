[package]
name = "tracker-app"
version = "0.7.0"
edition = "2021"

[dependencies]
tracker-core = { path = "../tracker-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.29"
egui = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
directories = "6"
# async-std backend: self-contained executor — the tokio feature panics
# ("no reactor running") unless a tokio runtime is active, which a plain
# eframe app doesn't have. See crash log 2026-07-16.
# rfd 0.17 dropped the async-std/tokio features; xdg-portal now drives
# itself with the self-contained pollster executor (same property).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25", default-features = false, features = ["png"] }
